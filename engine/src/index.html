<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><base href="/"><meta name="theme-color" content="#050810"><title>Galaxy · 三维宇宙探索</title><link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style id="galaxy-shell-style">
html,body{margin:0;background:#02040a;color:#eaf2ff}#main-recovery{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:8px;white-space:nowrap;padding:8px;background:#101b2bed;border:1px solid #c6dcff40;border-radius:14px;font:13px system-ui,sans-serif}#main-recovery[hidden],#main-status[hidden]{display:none!important}#main-recovery button{font:inherit;color:#eaf2ff;border:1px solid #c6dcff40;border-radius:8px;padding:9px 16px;background:transparent;cursor:pointer}#main-recovery button:focus-visible{outline:2px solid #b4d1ff;outline-offset:3px}#main-status{position:fixed;z-index:1001;left:10%;right:10%;bottom:95px;text-align:center;color:#b4c8e4;font:13px system-ui,sans-serif;pointer-events:none}
</style>
<style id="galaxy-mode-style"></style>
</head>
<body>
<main id="mode-root" aria-label="Galaxy 交互场景"></main>
<!-- Recovery for the sole 3D application; no alternate mode is initialized. -->
<div id="main-recovery" hidden><button id="main-retry" type="button">重新进入三维探索</button></div>
<p id="main-status" role="status" aria-live="polite">正在进入三维探索…</p>
<script type="module" src="/app.ts"></script>
</body></html>
